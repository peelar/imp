# Every push to main runs Changesets (.changeset/README.md). While changesets are pending, it opens or updates the
# release PR, which bumps host/package.json (Imp's version is the host's) and writes host/CHANGELOG.md. Merging that PR
# leaves none pending and a version with no release yet, so the same run publishes GitHub release v<version>, which
# installed hosts and Mac apps update to:
#   imp-host-vX.Y.Z.tar.gz   the host, its production dependencies and the built web client (host/src/update.ts)
#   Imp-macos.zip            the ad-hoc signed Mac app (scripts/install-mac.sh)
#   install-host.sh          the host installer
# The release is built here, not by a tag push, because a tag pushed with GITHUB_TOKEN starts no workflow.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release

env:
  # The Exact checkout the client builds with. Move it when the client moves to a newer Exact.
  EXACT_REPO: https://github.com/expo/exact
  EXACT_REV: fe917faa7f5b1f4eb3178b8c4473b88bd6053f5e

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.unreleased.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          title: Release Imp
          commit: Release Imp
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: unreleased
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./host/package.json").version')"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      matrix:
        include:
          - part: host
            runner: ubuntu-latest
          - part: mac
            # Exact's Mac host needs the macOS 26 SDK or newer.
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.cache/exact
          key: exact-${{ matrix.part }}-${{ runner.os }}-${{ env.EXACT_REV }}
      - name: Set up Exact
        run: |
          git init -q "$RUNNER_TEMP/exact"
          cd "$RUNNER_TEMP/exact"
          git fetch -q --depth 1 "$EXACT_REPO" "$EXACT_REV"
          git checkout -q FETCH_HEAD
          bun scripts/exact.mjs setup
          echo "EXACT=$RUNNER_TEMP/exact" >> "$GITHUB_ENV"
      # turbo, which prunes the workspace lockfile to the host's dependencies (scripts/package.sh).
      - run: npm ci
        if: matrix.part == 'host'
      - run: scripts/package.sh ${{ matrix.part }} "${{ needs.version.outputs.tag }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.part }}
          path: out/

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # The notes are this version's section of host/CHANGELOG.md; the tag is created at the commit that was built.
      - run: |
          awk -v heading="## ${TAG#v}" '$0 == heading { found = 1; next } found && /^## / { exit } found' host/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
