# Every push to main and every pull request: the lint policy, formatting, types, the host's API tests, and the docs build.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      # One install for the workspaces (host, client, docs) and the root's lint and type tooling.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx turbo run build --filter=@imp/docs
